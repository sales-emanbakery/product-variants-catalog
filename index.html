<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Eman Bakery - Taste of Tradition</title>

<!-- PWA / iOS app-like meta -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eman Bakery">
<meta name="theme-color" content="#005B3A">
<meta name="description" content="Eman Bakery product size and pack configuration tool">

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            green: '#005B3A',
            greenDark: '#003D27',
            greenLight: '#E6F1EC',
            gold: '#D4AF37',
            goldLight: '#FBF3DA',
            red: '#C1121F',
            redLight: '#FBEAEA',
          }
        },
        fontFamily: {
          display: ['Poppins', 'sans-serif'],
          body: ['Inter', 'sans-serif'],
        }
      }
    }
  }
</script>

<style>
  html, body {
    height: 100%;
    overscroll-behavior: none;
    font-family: 'Inter', sans-serif;
    background-color: #f8fafc;
  }

  #app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 560px;
    margin: 0 auto;
    background-color: #f8fafc;
    box-shadow: 0 0 40px rgba(0,0,0,0.06);
    position: relative;
  }

  header.app-header {
    padding-top: calc(env(safe-area-inset-top, 0px) + 0.75rem);
  }

  footer.app-footer {
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.75rem);
  }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  .font-display { font-family: 'Poppins', sans-serif; }

  #view-wrapper {
    transition: opacity 0.18s ease, transform 0.18s ease;
    opacity: 1;
    transform: translateY(0);
  }
  #view-wrapper.fading {
    opacity: 0;
    transform: translateY(10px);
  }

  .toggle-btn {
    transition: all 0.12s ease;
  }
  .toggle-btn:active {
    transform: scale(0.92);
  }

  .product-card {
    transition: all 0.15s ease;
  }
  .product-card:active {
    transform: scale(0.98);
  }

  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .pop-in { animation: pop 0.25s ease; }
</style>
</head>
<body class="bg-slate-50">

<div id="app">

  <!-- STICKY HEADER -->
  <header class="app-header sticky top-0 z-20 bg-white border-b border-slate-100 shadow-sm">
    <div class="flex items-center gap-3 px-4 pb-3">
      <div class="w-11 h-11 shrink-0 rounded-full flex items-center justify-center font-display font-bold text-sm shadow-inner"
           style="background: linear-gradient(135deg, #005B3A, #003D27); color: #D4AF37;">
        EB
      </div>
      <div class="leading-tight">
        <h1 class="font-display font-bold text-[17px]" style="color:#005B3A;">Eman Bakery</h1>
        <p class="text-[10px] font-semibold tracking-[0.14em]" style="color:#D4AF37;">TASTE OF TRADITION</p>
      </div>
    </div>
  </header>

  <!-- SCROLLABLE MIDDLE -->
  <main id="main-scroll" class="no-scrollbar flex-1 overflow-y-auto overscroll-contain px-4 py-4">
    <div id="view-wrapper"></div>
  </main>

  <!-- STICKY FOOTER -->
  <footer id="app-footer" class="app-footer sticky bottom-0 z-20 bg-white border-t border-slate-100 px-4 pt-3 shadow-[0_-4px_16px_rgba(0,0,0,0.04)]">
    <div id="footer-content" class="flex gap-3"></div>
  </footer>

</div>

<script>
/* ============================================================
   DATA
   ============================================================ */
const PRODUCTS = [
  "SHAMI WHITE BREAD",
  "SHAMI WHOLE WHEAT BREAD",
  "LEBANESE WHITE BREAD",
  "LEBANESE WHOLE WHEAT BREAD",
  "TORTILLA WHITE",
  "TORTILLA WHOLE WHEAT",
  "SAMOULI WHITE",
  "SAMOULI WHOLE WHEAT",
  "BURGER BREAD",
  "FALAFEL SANDWICH WHITE",
  "FALAFEL SANDWICH WHOLE WHEAT"
];

const STORAGE_KEY = "emanBakeryProductData";
const WHATSAPP_NUMBER = "966541885869"; // +966541885869 without the plus

/* ============================================================
   STATE
   ============================================================ */
let state = {
  view: "home",              // home | sizes | packs | results
  currentProduct: null,
  selectedSizes: [],         // array of ints, sorted
  packData: {},              // { size: [int, int, ...] }
  currentSizeIdx: 0
};

/* ============================================================
   PERSISTENCE
   ============================================================ */
function loadSavedData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    console.error("Failed to read saved data", e);
    return {};
  }
}

function persistSavedData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.error("Failed to save data", e);
  }
}

/* ============================================================
   HELPERS
   ============================================================ */
function getIcon(name) {
  if (name.includes("SHAMI")) return "🍞";
  if (name.includes("LEBANESE")) return "🫓";
  if (name.includes("TORTILLA")) return "🌯";
  if (name.includes("SAMOULI")) return "🥖";
  if (name.includes("BURGER")) return "🍔";
  if (name.includes("FALAFEL")) return "🧆";
  return "🍞";
}

function getType(name) {
  return name.includes("WHOLE WHEAT") ? "Whole Wheat" : "White";
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[s]));
}

function transitionTo(renderFn) {
  const wrapper = document.getElementById("view-wrapper");
  wrapper.classList.add("fading");
  setTimeout(() => {
    renderFn();
    document.getElementById("main-scroll").scrollTop = 0;
    requestAnimationFrame(() => wrapper.classList.remove("fading"));
  }, 160);
}

/* ============================================================
   VIEW 1: HOME
   ============================================================ */
function renderHome() {
  const saved = loadSavedData();
  const wrapper = document.getElementById("view-wrapper");

  const cards = PRODUCTS.map(name => {
    const isDone = !!saved[name];
    return `
      <button onclick="openProduct(${JSON.stringify(name).replace(/"/g, '&quot;')})"
        class="product-card w-full text-left bg-white rounded-2xl p-4 mb-3 flex items-center gap-3 border ${isDone ? 'border-brand-green/30 bg-brand-greenLight' : 'border-slate-100'} shadow-sm">
        <div class="w-12 h-12 shrink-0 rounded-xl flex items-center justify-center text-2xl bg-slate-50">
          ${getIcon(name)}
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-semibold text-slate-800 text-[14px] leading-snug">${escapeHtml(name)}</p>
          <span class="inline-block mt-1 text-[10px] font-semibold px-2 py-0.5 rounded-full"
                style="background:#FBF3DA; color:#8a6d1f;">
            ${getType(name)}
          </span>
        </div>
        ${isDone ? `
          <div class="w-7 h-7 shrink-0 rounded-full flex items-center justify-center pop-in" style="background:#005B3A;">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M16.7 5.3a1 1 0 010 1.4l-7.4 7.4a1 1 0 01-1.4 0L3.3 9.5a1 1 0 111.4-1.4l3.6 3.6 6.7-6.7a1 1 0 011.4 0z" clip-rule="evenodd"/>
            </svg>
          </div>
        ` : `
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0 text-slate-300" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M7.3 14.7a1 1 0 010-1.4L10.6 10 7.3 6.7a1 1 0 011.4-1.4l4 4a1 1 0 010 1.4l-4 4a1 1 0 01-1.4 0z" clip-rule="evenodd"/>
          </svg>
        `}
      </button>
    `;
  }).join("");

  wrapper.innerHTML = `
    <div class="mb-4">
      <h2 class="font-display font-bold text-lg text-slate-800">Products</h2>
      <p class="text-[13px] text-slate-500">Tap a product to set its sizes and pack quantities.</p>
    </div>
    ${cards}
    <div class="h-2"></div>
  `;

  document.getElementById("footer-content").innerHTML = `
    <button onclick="goToResults()"
      class="w-full py-3.5 rounded-xl font-display font-semibold text-[14px] text-white shadow-sm"
      style="background:#005B3A;">
      View Results
    </button>
  `;
}

function openProduct(name) {
  state.currentProduct = name;
  const saved = loadSavedData()[name];
  if (saved) {
    state.selectedSizes = [...saved.sizes];
    state.packData = JSON.parse(JSON.stringify(saved.packs));
  } else {
    state.selectedSizes = [];
    state.packData = {};
  }
  state.currentSizeIdx = 0;
  state.view = "sizes";
  transitionTo(renderSizes);
}

/* ============================================================
   VIEW 2: SIZE SELECTION
   ============================================================ */
function renderSizes() {
  const wrapper = document.getElementById("view-wrapper");

  const buttons = Array.from({ length: 45 }, (_, i) => i + 1).map(n => {
    const active = state.selectedSizes.includes(n);
    return `
      <button onclick="toggleSize(${n})"
        class="toggle-btn aspect-square rounded-lg border-2 flex items-center justify-center font-semibold text-[13px] ${
          active
            ? 'text-white border-transparent shadow-sm'
            : 'bg-white border-slate-200 text-slate-500'
        }"
        style="${active ? 'background:#005B3A;' : ''}">
        ${n}
      </button>
    `;
  }).join("");

  wrapper.innerHTML = `
    <div class="mb-4">
      <p class="text-[11px] font-semibold tracking-wide uppercase" style="color:#D4AF37;">Step 1 of 2</p>
      <h2 class="font-display font-bold text-lg text-slate-800 leading-snug">
        Select Sizes (cm) for<br>${escapeHtml(state.currentProduct)}
      </h2>
      <p class="text-[13px] text-slate-500 mt-1">Tap all sizes this product comes in.</p>
    </div>
    <div class="grid grid-cols-5 gap-2">
      ${buttons}
    </div>
    <div class="h-2"></div>
  `;

  renderSizesFooter();
}

function renderSizesFooter() {
  const hasSelection = state.selectedSizes.length > 0;
  document.getElementById("footer-content").innerHTML = `
    <button onclick="cancelFlow()"
      class="flex-1 py-3.5 rounded-xl font-display font-semibold text-[14px] border-2"
      style="border-color:#C1121F; color:#C1121F;">
      Cancel
    </button>
    <button onclick="goToPacksFromSizes()" ${hasSelection ? "" : "disabled"}
      class="flex-1 py-3.5 rounded-xl font-display font-semibold text-[14px] text-white ${hasSelection ? "" : "opacity-40"}"
      style="background:#005B3A;">
      Next
    </button>
  `;
}

function toggleSize(n) {
  const idx = state.selectedSizes.indexOf(n);
  if (idx > -1) {
    state.selectedSizes.splice(idx, 1);
  } else {
    state.selectedSizes.push(n);
  }
  state.selectedSizes.sort((a, b) => a - b);
  renderSizes();
}

function goToPacksFromSizes() {
  if (state.selectedSizes.length === 0) return;
  state.currentSizeIdx = 0;
  state.view = "packs";
  transitionTo(renderPacks);
}

/* ============================================================
   VIEW 3: PACK QUANTITY SELECTION (per size)
   ============================================================ */
function renderPacks() {
  const wrapper = document.getElementById("view-wrapper");
  const size = state.selectedSizes[state.currentSizeIdx];
  if (!state.packData[size]) state.packData[size] = [];

  const total = state.selectedSizes.length;
  const step = state.currentSizeIdx + 1;

  const buttons = Array.from({ length: 30 }, (_, i) => i + 1).map(n => {
    const active = state.packData[size].includes(n);
    return `
      <button onclick="togglePack(${n})"
        class="toggle-btn aspect-square rounded-lg border-2 flex items-center justify-center font-semibold text-[13px] ${
          active
            ? 'text-white border-transparent shadow-sm'
            : 'bg-white border-slate-200 text-slate-500'
        }"
        style="${active ? 'background:#D4AF37;' : ''}">
        ${n}
      </button>
    `;
  }).join("");

  wrapper.innerHTML = `
    <div class="mb-4">
      <p class="text-[11px] font-semibold tracking-wide uppercase" style="color:#D4AF37;">Step 2 of 2 &middot; Step ${step} of ${total}</p>
      <h2 class="font-display font-bold text-lg text-slate-800 leading-snug">
        Pack Quantities for<br>${escapeHtml(state.currentProduct)} &mdash; Size: ${size}cm
      </h2>
      <p class="text-[13px] text-slate-500 mt-1">Tap all pack sizes (pieces) available for ${size}cm.</p>
    </div>
    <div class="grid grid-cols-5 gap-2">
      ${buttons}
    </div>
    <div class="h-2"></div>
  `;

  renderPacksFooter();
}

function renderPacksFooter() {
  const isLast = state.currentSizeIdx === state.selectedSizes.length - 1;
  document.getElementById("footer-content").innerHTML = `
    <button onclick="goBackPacks()"
      class="flex-1 py-3 rounded-xl font-display font-semibold text-[13px] border-2 border-slate-200 text-slate-500">
      Back
    </button>
    <button onclick="cancelFlow()"
      class="flex-1 py-3 rounded-xl font-display font-semibold text-[13px] border-2"
      style="border-color:#C1121F; color:#C1121F;">
      Cancel
    </button>
    <button onclick="goNextPacks()"
      class="flex-[1.3] py-3 rounded-xl font-display font-semibold text-[13px] text-white"
      style="background:#005B3A;">
      ${isLast ? "Finish" : "Next Size"}
    </button>
  `;
}

function togglePack(n) {
  const size = state.selectedSizes[state.currentSizeIdx];
  const arr = state.packData[size];
  const idx = arr.indexOf(n);
  if (idx > -1) {
    arr.splice(idx, 1);
  } else {
    arr.push(n);
  }
  arr.sort((a, b) => a - b);
  renderPacks();
}

function goBackPacks() {
  if (state.currentSizeIdx === 0) {
    state.view = "sizes";
    transitionTo(renderSizes);
  } else {
    state.currentSizeIdx -= 1;
    transitionTo(renderPacks);
  }
}

function goNextPacks() {
  const isLast = state.currentSizeIdx === state.selectedSizes.length - 1;
  if (isLast) {
    finishProduct();
  } else {
    state.currentSizeIdx += 1;
    transitionTo(renderPacks);
  }
}

function finishProduct() {
  const data = loadSavedData();
  const packsOut = {};
  state.selectedSizes.forEach(size => {
    packsOut[size] = state.packData[size] || [];
  });
  data[state.currentProduct] = {
    sizes: [...state.selectedSizes],
    packs: packsOut
  };
  persistSavedData(data);

  state.currentProduct = null;
  state.selectedSizes = [];
  state.packData = {};
  state.currentSizeIdx = 0;
  state.view = "home";
  transitionTo(renderHome);
}

function cancelFlow() {
  const hasProgress = state.selectedSizes.length > 0;
  if (hasProgress && !confirm("Discard changes and return to Home?")) return;
  state.currentProduct = null;
  state.selectedSizes = [];
  state.packData = {};
  state.currentSizeIdx = 0;
  state.view = "home";
  transitionTo(renderHome);
}

/* ============================================================
   VIEW 4: RESULTS DASHBOARD
   ============================================================ */
function goToResults() {
  state.view = "results";
  transitionTo(renderResults);
}

function renderResults() {
  const wrapper = document.getElementById("view-wrapper");
  const saved = loadSavedData();
  const names = Object.keys(saved);

  if (names.length === 0) {
    wrapper.innerHTML = `
      <div class="mb-4">
        <h2 class="font-display font-bold text-lg text-slate-800">Results</h2>
      </div>
      <div class="bg-white rounded-2xl border border-slate-100 p-8 text-center">
        <p class="text-3xl mb-2">📋</p>
        <p class="text-slate-500 text-[13px]">No saved products yet.<br>Configure a product from Home to see it here.</p>
      </div>
    `;
  } else {
    const cards = names.map(name => {
      const entry = saved[name];
      const rows = entry.sizes.map(size => {
        const packs = (entry.packs[size] || []).join(", ");
        return `
          <div class="flex items-start justify-between py-1.5 border-b border-slate-50 last:border-0">
            <span class="text-[13px] font-semibold text-slate-700">${size} cm</span>
            <span class="text-[13px] text-slate-500 text-right max-w-[65%]">${packs ? packs + " pcs" : "&mdash;"}</span>
          </div>
        `;
      }).join("");

      return `
        <div class="bg-white rounded-2xl border border-slate-100 p-4 mb-3 shadow-sm">
          <div class="flex items-center gap-3 mb-2">
            <div class="w-9 h-9 shrink-0 rounded-lg flex items-center justify-center text-lg bg-slate-50">
              ${getIcon(name)}
            </div>
            <p class="font-semibold text-[13.5px] text-slate-800 flex-1 leading-snug">${escapeHtml(name)}</p>
          </div>
          <div class="mb-2">${rows}</div>
          <button onclick="deleteProduct(${JSON.stringify(name).replace(/"/g, '&quot;')})"
            class="w-full mt-1 py-2 rounded-lg text-[12px] font-semibold border-2"
            style="border-color:#C1121F; color:#C1121F;">
            Delete
          </button>
        </div>
      `;
    }).join("");

    wrapper.innerHTML = `
      <div class="mb-4">
        <h2 class="font-display font-bold text-lg text-slate-800">Results</h2>
        <p class="text-[13px] text-slate-500">${names.length} product${names.length > 1 ? "s" : ""} configured.</p>
      </div>
      ${cards}
      <div class="h-2"></div>
    `;
  }

  document.getElementById("footer-content").innerHTML = `
    <button onclick="backToHomeFromResults()"
      class="flex-1 py-3.5 rounded-xl font-display font-semibold text-[14px] border-2 border-slate-200 text-slate-500">
      Back
    </button>
    <button onclick="shareWhatsApp()"
      class="flex-[1.4] py-3.5 rounded-xl font-display font-semibold text-[14px] text-white flex items-center justify-center gap-2"
      style="background:#25D366;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-4 h-4 fill-white">
        <path d="M17.6 6.32A7.85 7.85 0 0012.05 4a7.94 7.94 0 00-6.9 11.87L4 20l4.24-1.11a7.93 7.93 0 003.8.97h0a7.94 7.94 0 007.94-7.93 7.86 7.86 0 00-2.38-5.6zm-5.55 12.2h0a6.6 6.6 0 01-3.36-.92l-.24-.14-2.5.66.67-2.44-.16-.25a6.6 6.6 0 01 10.02-8.5 6.55 6.55 0 011.94 4.67 6.6 6.6 0 01-6.37 6.92zm3.6-4.93c-.2-.1-1.17-.58-1.35-.64-.18-.07-.31-.1-.44.1-.13.19-.5.64-.62.77-.11.13-.23.14-.42.05a5.4 5.4 0 01-1.6-.98 5.98 5.98 0 01-1.1-1.37c-.12-.2 0-.3.09-.4.09-.1.2-.24.3-.36.1-.12.13-.2.2-.34.06-.13.03-.25-.02-.35-.05-.1-.44-1.06-.6-1.45-.16-.38-.32-.33-.44-.33-.11 0-.24-.01-.37-.01-.13 0-.34.05-.52.24-.18.19-.68.67-.68 1.62 0 .96.7 1.89.8 2.02.1.13 1.37 2.1 3.33 2.94.47.2.83.32 1.11.41.47.15.9.13 1.24.08.38-.06 1.17-.48 1.33-.94.16-.46.16-.85.11-.94-.05-.09-.18-.14-.38-.24z"/>
      </svg>
      Share on WhatsApp
    </button>
  `;
}

function deleteProduct(name) {
  if (!confirm(`Delete saved data for "${name}"?`)) return;
  const data = loadSavedData();
  delete data[name];
  persistSavedData(data);
  transitionTo(renderResults);
}

function backToHomeFromResults() {
  state.view = "home";
  transitionTo(renderHome);
}

function shareWhatsApp() {
  const saved = loadSavedData();
  const names = Object.keys(saved);
  if (names.length === 0) {
    alert("No data to share yet.");
    return;
  }

  let text = "*Eman Bakery — Sizes & Pack Quantities*\n\n";
  names.forEach(name => {
    const entry = saved[name];
    text += `*${name}*\n`;
    entry.sizes.forEach(size => {
      const packs = (entry.packs[size] || []).join(", ");
      text += `- ${size}cm: ${packs || "no packs"} pcs\n`;
    });
    text += "\n";
  });

  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
  window.open(url, "_blank");
}

/* ============================================================
   INIT
   ============================================================ */
renderHome();
</script>

</body>
</html>
